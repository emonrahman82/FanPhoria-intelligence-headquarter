<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FanPhoria — Anime Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --red:#C41E2A;
    --red-dark:#8F1420;
    --ink:#171310;
    --paper:#F3EFE6;
    --card:#FBF9F3;
    --gold:#D9A441;
    --line:#E3DACB;
    --muted:#6B6259;
    --green:#3B7A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  .masthead{
    background:var(--ink);
    color:var(--paper);
    padding:28px 40px 22px;
    border-bottom:5px solid var(--red);
  }
  .masthead-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    gap:16px;
  }
  .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:42px;
    letter-spacing:1px;
    color:var(--paper);
  }
  .logo span{color:var(--red);}
  .tagline{
    font-size:13px;
    color:#C9C2B5;
    font-style:italic;
  }
  .subtitle{
    max-width:1100px;
    margin:6px auto 0;
    font-size:14px;
    color:#B9B2A4;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:28px 40px 60px;
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .controls-left, .controls-right{
    display:flex;
    gap:10px;
    align-items:center;
  }
  select, input[type=text], input[type=number]{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--card);
    color:var(--ink);
  }
  button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:4px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  button:hover{opacity:0.85;}

  #status-banner{
    display:none;
    background:#FCEBEB;
    border:1px solid #F0999A;
    color:#8F1420;
    padding:12px 16px;
    border-radius:4px;
    font-size:13px;
    margin-bottom:20px;
  }
  #status-banner.visible{display:block;}
  #status-banner code{
    background:#FBDADB;
    padding:1px 5px;
    border-radius:3px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
  }

  .row{
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card);
    margin-bottom:10px;
    overflow:hidden;
  }
  .row-head{
    display:grid;
    grid-template-columns:36px 1fr 90px 110px 170px 90px;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    cursor:pointer;
  }
  .rank{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--muted);
    font-size:14px;
  }
  .title-block .name{
    font-weight:600;
    font-size:15px;
  }
  .title-block .genres{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .demand{
    text-align:right;
  }
  .demand .num{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:19px;
  }
  .demand .label{
    font-size:10px;
    color:var(--muted);
    text-transform:none;
  }
  .sparkline{width:100%;height:32px;}
  .flag{
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:3px;
    text-align:center;
    white-space:nowrap;
  }
  .flag.urgent{background:#FCEBEB;color:var(--red-dark);}
  .flag.strong{background:#FBF1DD;color:#7A5510;}
  .flag.watch{background:#EEEAE0;color:var(--muted);}
  .flag.overstock{background:#E9EFE9;color:var(--green);}
  .flag.low{background:#EEEAE0;color:var(--muted);}
  .stock-price{
    font-size:12px;
    color:var(--muted);
    text-align:right;
  }
  .row-detail{
    display:none;
    padding:0 16px 18px;
    border-top:1px solid var(--line);
  }
  .row-detail.open{display:block;}
  .detail-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-top:14px;
  }
  .chart-wrap{position:relative;height:180px;}
  .detail-stats{
    font-size:13px;
  }
  .detail-stats div{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .detail-stats div:last-child{border-bottom:none;}
  .detail-stats .k{color:var(--muted);}
  .detail-stats .v{font-weight:600;font-family:'JetBrains Mono',monospace;}
  .remove-link{
    font-size:12px;
    color:var(--red-dark);
    background:none;
    border:none;
    padding:0;
    text-decoration:underline;
    cursor:pointer;
    margin-top:10px;
  }

  section.discover{
    margin-top:36px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  section.discover h2{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;
    font-weight:400;
    letter-spacing:0.5px;
    margin:0 0 4px;
  }
  section.discover p{
    font-size:13px;
    color:var(--muted);
    margin:0 0 16px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:20px;
    padding:6px 8px 6px 14px;
    font-size:13px;
  }
  .chip button{
    padding:4px 10px;
    font-size:11px;
    border-radius:14px;
  }
  .chip.tracked{opacity:0.5;}
  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-size:14px;
  }
  .loading{
    text-align:center;
    padding:40px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="logo">Fan<span>Phoria</span></div>
    <div class="tagline">By the fans, for the fans</div>
  </div>
  <div class="subtitle">Anime intelligence — what to stock next, ranked by real demand signals</div>
</div>

<main>
  <div id="status-banner"></div>

  <div class="controls">
    <div class="controls-left">
      <select id="timeframe">
        <option value="today 1-m">Last month</option>
        <option value="today 3-m" selected>Last 3 months</option>
        <option value="today 12-m">Last 12 months</option>
      </select>
      <select id="geo">
        <option value="">Worldwide</option>
        <option value="US">United States</option>
        <option value="JP">Japan</option>
        <option value="GB">United Kingdom</option>
        <option value="BD">Bangladesh</option>
      </select>
      <button class="secondary" id="refresh-btn">Refresh</button>
    </div>
    <div class="controls-right">
      <input type="text" id="new-anime-name" placeholder="Add a title to track">
      <input type="number" id="new-anime-stock" placeholder="Stock" style="width:70px;">
      <input type="number" id="new-anime-price" placeholder="Price" style="width:80px;">
      <button id="add-btn">Add to watchlist</button>
    </div>
  </div>

  <div id="rows-container">
    <div class="loading">Loading recommendations…</div>
  </div>

  <section class="discover">
    <h2>Trending on AniList</h2>
    <p>Titles gaining fandom momentum that aren't on your watchlist yet.</p>
    <div id="discover-chips" class="chips">
      <div class="loading">Loading…</div>
    </div>
  </section>
</main>

<script>
const API_BASE = "http://localhost:5000";
let currentData = [];
let openDetailId = null;
let chartInstances = {};

function apiUrl(path, params) {
  const url = new URL(API_BASE + path);
  if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  return url.toString();
}

function showBanner(message) {
  const el = document.getElementById('status-banner');
  el.innerHTML = message;
  el.classList.add('visible');
}
function hideBanner() {
  document.getElementById('status-banner').classList.remove('visible');
}

async function fetchJSON(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Request failed (${res.status})`);
  }
  return res.json();
}

function tierClass(rec) {
  const map = {
    "Restock urgently": "urgent",
    "Strong sell candidate": "strong",
    "Trending up - consider stocking": "strong",
    "Watch closely": "watch",
    "Monitor - possible overstock": "watch",
    "Overstock risk": "overstock",
    "Low priority": "low"
  };
  return map[rec] || "watch";
}

function renderRows(items) {
  const container = document.getElementById('rows-container');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state">No titles tracked yet. Add one above to get your first recommendation.</div>`;
    return;
  }

  container.innerHTML = items.map((item, i) => {
    const rowId = `row-${i}`;
    const stockStr = item.current_stock != null ? `${item.current_stock} in stock` : 'stock unknown';
    const priceStr = item.price != null ? `$${Number(item.price).toFixed(2)}` : '';
    return `
    <div class="row" data-index="${i}">
      <div class="row-head" onclick="toggleDetail(${i})">
        <div class="rank">#${i + 1}</div>
        <div class="title-block">
          <div class="name">${escapeHtml(item.anime)}</div>
          <div class="genres">${(item.genres || []).join(', ') || '—'}</div>
        </div>
        <div class="demand">
          <div class="num">${item.demand_score}</div>
          <div class="label">demand</div>
        </div>
        <div class="sparkline-wrap"><canvas class="sparkline" id="spark-${i}"></canvas></div>
        <div class="flag ${tierClass(item.recommendation)}">${escapeHtml(item.recommendation)}</div>
        <div class="stock-price">${stockStr}${priceStr ? ' · ' + priceStr : ''}</div>
      </div>
      <div class="row-detail" id="${rowId}">
        <p style="font-size:13px;color:var(--muted);margin:12px 0 0;">${escapeHtml(item.reason)}</p>
        <div class="detail-grid">
          <div class="chart-wrap"><canvas id="detail-chart-${i}"></canvas></div>
          <div class="detail-stats">
            <div><span class="k">Trend interest (avg)</span><span class="v">${item.trend_avg_interest}</span></div>
            <div><span class="k">Trend direction</span><span class="v">${item.trend_direction}</span></div>
            <div><span class="k">AniList trending</span><span class="v">${item.anilist_trending}</span></div>
            <div><span class="k">AniList popularity</span><span class="v">${item.anilist_popularity}</span></div>
            <div><span class="k">Community score</span><span class="v">${item.average_score}</span></div>
            <button class="remove-link" onclick="removeAnime('${escapeHtml(item.anime).replace(/'/g,"\\'")}', event)">Remove from watchlist</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  items.forEach((item, i) => drawSparkline(i, item.anime));
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

async function drawSparkline(index, animeName) {
  try {
    const timeframe = document.getElementById('timeframe').value;
    const geo = document.getElementById('geo').value;
    const series = await fetchJSON(apiUrl(`/api/trends/${encodeURIComponent(animeName)}`, { timeframe, geo }));
    const canvas = document.getElementById(`spark-${index}`);
    if (!canvas || !series.length) return;
    const ctx = canvas.getContext('2d');
    if (chartInstances[`spark-${index}`]) chartInstances[`spark-${index}`].destroy();
    chartInstances[`spark-${index}`] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(p => p.date),
        datasets: [{
          data: series.map(p => p.interest),
          borderColor: '#C41E2A',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  } catch (e) {
    // Sparkline is best-effort; silently skip if trends data unavailable
  }
}

async function drawDetailChart(index, animeName) {
  try {
    const timeframe = document.getElementById('timeframe').value;
    const geo = document.getElementById('geo').value;
    const series = await fetchJSON(apiUrl(`/api/trends/${encodeURIComponent(animeName)}`, { timeframe, geo }));
    const canvas = document.getElementById(`detail-chart-${index}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const key = `detail-${index}`;
    if (chartInstances[key]) chartInstances[key].destroy();
    if (!series.length) {
      canvas.parentElement.innerHTML = '<p style="font-size:13px;color:var(--muted);">No trend data available for this title.</p>';
      return;
    }
    chartInstances[key] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(p => p.date),
        datasets: [{
          label: 'Search interest',
          data: series.map(p => p.interest),
          borderColor: '#C41E2A',
          backgroundColor: 'rgba(196,30,42,0.08)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.25,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { mode: 'index', intersect: false }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 6, font: { size: 10 } }, grid: { display: false } },
          y: { min: 0, max: 100, ticks: { font: { size: 10 } }, grid: { color: '#E3DACB' } }
        }
      }
    });
  } catch (e) {
    // best-effort
  }
}

function toggleDetail(index) {
  const detailEl = document.getElementById(`row-${index}`);
  const isOpen = detailEl.classList.contains('open');
  document.querySelectorAll('.row-detail.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) {
    detailEl.classList.add('open');
    drawDetailChart(index, currentData[index].anime);
  }
}

async function loadRecommendations() {
  const container = document.getElementById('rows-container');
  container.innerHTML = `<div class="loading">Loading recommendations…</div>`;
  const timeframe = document.getElementById('timeframe').value;
  const geo = document.getElementById('geo').value;
  try {
    const data = await fetchJSON(apiUrl('/api/recommendations', { timeframe, geo }));
    currentData = data;
    hideBanner();
    renderRows(data);
  } catch (e) {
    currentData = [];
    container.innerHTML = '';
    showBanner(`Couldn't reach the FanPhoria backend. Make sure it's running: <code>cd backend && python app.py</code>, then click Refresh.`);
  }
}

async function loadDiscover() {
  const container = document.getElementById('discover-chips');
  try {
    const data = await fetchJSON(apiUrl('/api/discover', { limit: 12 }));
    if (!data.length) {
      container.innerHTML = `<div class="loading">No discovery data available right now.</div>`;
      return;
    }
    container.innerHTML = data.map(item => `
      <div class="chip ${item.already_tracked ? 'tracked' : ''}">
        ${escapeHtml(item.title)}
        ${item.already_tracked
          ? '<span style="font-size:11px;color:var(--muted);">tracked</span>'
          : `<button onclick="quickAdd('${escapeHtml(item.title).replace(/'/g,"\\'")}')">+ Track</button>`}
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '';
  }
}

async function quickAdd(name) {
  try {
    await fetchJSON(apiUrl('/api/watchlist'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anime_name: name })
    });
    await loadRecommendations();
    await loadDiscover();
  } catch (e) {
    showBanner(`Couldn't add title: ${escapeHtml(e.message)}`);
  }
}

async function removeAnime(name, evt) {
  if (evt) evt.stopPropagation();
  try {
    await fetchJSON(apiUrl(`/api/watchlist/${encodeURIComponent(name)}`), { method: 'DELETE' });
    await loadRecommendations();
    await loadDiscover();
  } catch (e) {
    showBanner(`Couldn't remove title: ${escapeHtml(e.message)}`);
  }
}

document.getElementById('add-btn').addEventListener('click', async () => {
  const name = document.getElementById('new-anime-name').value.trim();
  const stock = document.getElementById('new-anime-stock').value;
  const price = document.getElementById('new-anime-price').value;
  if (!name) return;
  try {
    await fetchJSON(apiUrl('/api/watchlist'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        anime_name: name,
        current_stock: stock ? parseInt(stock, 10) : null,
        price: price ? parseFloat(price) : null
      })
    });
    document.getElementById('new-anime-name').value = '';
    document.getElementById('new-anime-stock').value = '';
    document.getElementById('new-anime-price').value = '';
    await loadRecommendations();
    await loadDiscover();
  } catch (e) {
    showBanner(`Couldn't add title: ${escapeHtml(e.message)}`);
  }
});

document.getElementById('refresh-btn').addEventListener('click', () => {
  loadRecommendations();
});
document.getElementById('timeframe').addEventListener('change', loadRecommendations);
document.getElementById('geo').addEventListener('change', loadRecommendations);

loadRecommendations();
loadDiscover();
</script>

</body>
</html>
